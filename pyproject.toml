[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["egon_content"]

[tool.uv]
package = true

[project]
name = "egon-content"
version = "0.2.0"
description = "CLI tool to generate mental health Markdown articles for Logseq or Obsidian"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.7,<3",
    "json-repair>=0.30.0",
    "matplotlib>=3.9.0",
    "networkx>=3.4.0",
    "openai>=3.48,<4",
    "pillow>=13.0",
    "typer>=0.15.0",
    "python-dotenv>=1.1.0",
]

[project.scripts]
egon-content = "egon_content.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
addopts = "--cov=egon_content --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]

[tool.coverage.run]
source = ["egon_content"]
omit = ["tests/*", ".venv/*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "F401"]
